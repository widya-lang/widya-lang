[package]
name = "widyabase"
version = "2.6.0"
edition = "2024"
description = "WidyaBase: Embedded High-Performance Hybrid SQL, Vector HNSW, Document, WAL, Raft Consensus, and pgwire Server"

[dependencies]
widya-core = { path = "../widya-core" }
widya-vm = { path = "../widya-vm" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
colored = "2.1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
aes-gcm = "0.10"
hmac = "0.12"
tokio = { version = "1.40", features = ["sync"] }
regex = "1.10"
uuid = { version = "1.8", features = ["v4", "serde"] }

[lints.rust]
dead_code = "allow"
unused_variables = "allow"
unused_imports = "allow"
