# ==============================================================================
# Konfigurasi Nginx untuk Portal Resmi widya-lang.org
# Penempatan di server: /etc/nginx/sites-available/widya-lang.org
# Symlink: ln -s /etc/nginx/sites-available/widya-lang.org /etc/nginx/sites-enabled/
# ==============================================================================

# 1. Pengalihan HTTP ke HTTPS Otomatis
server {
    listen 80;
    listen [::]:80;
    server_name widya-lang.org www.widya-lang.org;

    # Validasi ACME Challenge Certbot Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/widya-lang.org;
    }

    location / {
        return 301 https://widya-lang.org$request_uri;
    }
}

# 2. Server Blok HTTPS Utama
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name widya-lang.org www.widya-lang.org;

    root /var/www/widya-lang.org;
    index index.html;

    # Sertifikat SSL (Gunakan Certbot: sudo certbot --nginx -d widya-lang.org -d www.widya-lang.org)
    ssl_certificate /etc/letsencrypt/live/widya-lang.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/widya-lang.org/privkey.pem;

    # Protokol & Sandi Kriptografi Modern (TLS 1.2 & TLS 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Header Keamanan Industri (Grade A+)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Kompresi Gzip untuk Kecepatan Loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Routing Bersih (Clean URLs)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Berkas Unduhan Rilis (ZIP, PDF, VSIX)
    location /downloads/ {
        alias /var/www/widya-lang.org/downloads/;
        autoindex off;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Cache untuk Berkas Statis (CSS, JS, Ikon)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Berkas Keamanan .well-known
    location /.well-known/security.txt {
        add_header Content-Type text/plain;
    }

    # Log Akses dan Galat
    access_log /var/log/nginx/widya-lang_access.log;
    error_log /var/log/nginx/widya-lang_error.log warn;
}
