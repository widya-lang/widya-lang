[package]
name = "widya-wpm"
version = "2.6.0"
edition = "2024"
description = "Widya Package Manager (WPM): Sovereign Package Registry, Dependency Resolver, and PubGrub Engine"

[dependencies]
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

[lints.rust]
dead_code = "allow"
unused_variables = "allow"
unused_imports = "allow"
