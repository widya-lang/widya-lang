[package]
name = "widya_office_desktop"
version = "1.0.0"
authors = ["Widya-Lang Core Architecture Team"]
edition = "2026"
description = "Suite Perkantoran Berdaulat Generasi Baru untuk Desktop (WidyaWriter, WidyaCalc, WidyaImpress, WidyaPDF)"
license = "Proprietary & Sovereign Nusantara"

[desktop]
app_id = "id.widya.office.desktop"
app_name = "WidyaOffice Desktop"
main_window = { width = 1280, height = 800, min_width = 800, min_height = 600, resizable = true, dark_mode = true, background_effect = "MicaDark" }
tray_enabled = true
security_grade = "Enterprise Grade (A+)"
require_ipc_token = true
encrypted_storage = true

[features]
native_docx_omml = true
mail_merge_wizard = true
crdt_offline_collab = true
pqc_digital_signature = true
zero_electron_dependency = true

[dependencies]
# 100% Zero External Dependencies - Uses built-in Widya Standard Library
widya_office = "path:../../src/office"
widya_desktop = "path:../../src/desktop"
widya_kripto = "path:../../src/kripto"
