[package]
name = "widya-vm"
version = "2.6.0"
edition = "2024"
description = "Widya-Lang Virtual Machine: Register-Based Bytecode VM, NaN-Boxing, and OTP Fiber Scheduler"

[dependencies]
widya-core = { path = "../widya-core" }
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
