[workspace]
members = [
    "crates/widya-core",
    "crates/widya-vm",
    "crates/widya-compiler",
    "crates/widyabase",
    "crates/widya-wpm",
]

[package]
name = "widya"
version = "2.6.0"
edition = "2024"
default-run = "widya"

[dependencies]
widya-core = { path = "crates/widya-core" }
widya-vm = { path = "crates/widya-vm" }
widya-compiler = { path = "crates/widya-compiler" }
widyabase = { path = "crates/widyabase" }
widya-wpm = { path = "crates/widya-wpm" }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
rustyline = "14.0"
rand = "0.8"
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
regex = "1.10"
ureq = { version = "2.12", features = ["json"] }
sha1 = "0.10"
base64 = "0.22"
libloading = "0.8"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rsa = "0.9"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
argon2 = "0.5"
sha3 = "0.10"
serde_bytes = "0.11"
rustls = "0.23"
webpki = "0.22"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
mysql = "24"
postgres = "0.19"
duckdb = { version = "1.0", features = ["bundled"] }
redb = "2.1"
serde_cbor = "0.11"
surrealdb = { version = "2.0", default-features = false, features = ["kv-mem"] }
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "macros", "sync"] }

[lints.rust]
dead_code = "allow"
unused_variables = "allow"
unused_imports = "allow"