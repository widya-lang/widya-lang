# ====================================================================
# WIDYAOS DUAL-SLOT A/B & GOLDEN RECOVERY BOOTLOADER CONFIGURATION
# Standar Bootloader Mandiri Berdaulat (GRUB 2.06+ / systemd-boot)
# Hak Cipta (C) 2026 Kemendikdasmen & Tim Pengembang WidyaOS
# ====================================================================

set default="0"
set timeout=3
set fallback="1 2"

# Simpan state bootloader untuk proteksi watchdog
if [ -s $prefix/grubenv ]; then
  load_env
fi

# Inisialisasi penghitung watchdog gagal boot (maksimal 3 percobaan)
if [ "${boot_failed_count}" -ge 3 ]; then
  set default="1"
  set boot_failed_count=0
  save_env boot_failed_count
fi

# Tema & Tampilan Visual Berdaulat Nusantara
set color_normal=light-gray/black
set color_highlight=white/blue

menuentry "1. WidyaOS Edisi Sekolah (Slot A - Aktif)" --class widyaos --class gnu-linux --class os {
    recordfail
    load_video
    set gfxpayload=keep
    insmod gzio
    insmod part_gpt
    insmod erofs
    search --no-floppy --set=root --label SLOT_A
    echo "Memuat Kernel WidyaOS (Slot A)..."
    linux /boot/vmlinuz-widyaos root=LABEL=SLOT_A ro quiet splash audit=0 widya_sec=strict vt.global_cursor_default=0
    initrd /boot/initramfs-widyaos.img
}

menuentry "2. WidyaOS Edisi Sekolah (Slot B - Pembaruan OTA)" --class widyaos --class gnu-linux --class os {
    recordfail
    load_video
    set gfxpayload=keep
    insmod gzio
    insmod part_gpt
    insmod erofs
    search --no-floppy --set=root --label SLOT_B
    echo "Memuat Kernel WidyaOS (Slot B OTA)..."
    linux /boot/vmlinuz-widyaos-ota root=LABEL=SLOT_B ro quiet splash audit=0 widya_sec=strict
    initrd /boot/initramfs-widyaos-ota.img
}

menuentry "3. WidyaOS Golden Recovery (Setelan Murni Pabrik Pusdatin)" --class recovery --class os {
    load_video
    set gfxpayload=keep
    insmod gzio
    insmod part_gpt
    insmod squash4
    search --no-floppy --set=root --label GOLDEN_RECOVERY
    echo "MEMULIHKAN SISTEM KE CITRA EMAS PABRIK..."
    linux /recovery/vmlinuz-recovery root=LABEL=GOLDEN_RECOVERY ro recovery_mode=1
    initrd /recovery/initramfs-recovery.img
}

menuentry "4. WidyaOS Live Session ANBK (Mode Diskless Steril di RAM)" --class anbk --class os {
    load_video
    set gfxpayload=keep
    insmod gzio
    insmod part_gpt
    insmod squash4
    search --no-floppy --set=root --label GOLDEN_RECOVERY
    echo "Memulai Sesi Asesmen Nasional Berbasis Komputer (ANBK 100% RAM)..."
    linux /boot/vmlinuz-widyaos toram=yes anbk_mode=strict no_local_storage_mount=1
    initrd /boot/initramfs-anbk.img
}

menuentry "5. Pemeriksaan Integritas Perangkat Keras & TPM 2.0 (OEM QA)" --class tool {
    echo "Menjalankan Diagnostik Mandiri WidyaHAL & TPM 2.0..."
    linux /boot/widya_hw_diag.bin
}
