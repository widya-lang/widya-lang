<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WidyaLab Virtual | Laboratorium Sains Interaktif Fisika, Kimia, & Biologi</title>
    <meta name="description" content="Laboratorium Sains Virtual Interaktif Setara PhET & Labster untuk Smart IFP Kelas: Gerak Parabola, Rangkaian Listrik Ohm, Titrasi Asam Basa, dan Mikroskop Digital.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0e1a;
            --bg-surface: #101728;
            --bg-panel: #162035;
            --bg-canvas: #0c1222;
            --border: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(6, 182, 212, 0.4);
            --primary: #06b6d4;
            --primary-glow: rgba(6, 182, 212, 0.25);
            --secondary: #818cf8;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-main: 'Outfit', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Topbar */
        .topbar {
            height: 54px;
            background: #0d1424;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(6, 182, 212, 0.12);
            border: 1px solid rgba(6, 182, 212, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
        }

        .brand-badge svg {
            width: 20px;
            height: 20px;
            fill: var(--primary);
        }

        .brand-badge h1 {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
        }

        .tab-stations {
            display: flex;
            gap: 6px;
        }

        .station-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .station-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .station-btn.active {
            background: var(--primary);
            color: #042f2e;
            border-color: var(--primary);
            font-weight: 700;
        }

        /* Workspace Grid */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 340px 1fr;
            overflow: hidden;
        }

        /* Controls Panel */
        .controls-panel {
            background: #0e1628;
            border-right: 1px solid var(--border);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-title {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .slider-group {
            margin-bottom: 16px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 12.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .slider-header span.val {
            font-family: var(--font-code);
            color: var(--primary);
            font-weight: 600;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
        }

        .btn-action {
            background: var(--primary);
            border: none;
            color: #042f2e;
            padding: 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background: #22d3ee;
            box-shadow: 0 0 12px var(--primary-glow);
        }

        .readout-card {
            background: #131c30;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
        }

        .readout-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 12.5px;
        }

        .readout-row span.val {
            font-family: var(--font-code);
            color: #38bdf8;
            font-weight: 600;
        }

        /* Canvas Stage */
        .stage-area {
            background: var(--bg-canvas);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 24px;
        }

        .simulation-canvas {
            background: #090e18;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Microscope View */
        .microscope-circle {
            width: 440px;
            height: 440px;
            border-radius: 50%;
            border: 8px solid #334155;
            background: #000;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.9), 0 0 25px rgba(6, 182, 212, 0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell-specimen {
            width: 100%;
            height: 100%;
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body>

    <!-- TOPBAR -->
    <header class="topbar">
        <div class="brand-section">
            <div class="brand-badge">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                <h1>WidyaLab Virtual</h1>
            </div>
            <span style="font-size: 12.5px; color: var(--text-muted);">Laboratorium Sains Interaktif Berdaulat untuk Smart IFP</span>
        </div>

        <div class="tab-stations">
            <button class="station-btn active" id="btnFisika" onclick="setStation('fisika')">Fisika: Gerak Parabola</button>
            <button class="station-btn" id="btnListrik" onclick="setStation('listrik')">Fisika: Hukum Ohm</button>
            <button class="station-btn" id="btnKimia" onclick="setStation('kimia')">Kimia: Titrasi Asam-Basa</button>
            <button class="station-btn" id="btnBiologi" onclick="setStation('biologi')">Biologi: Mikroskop Sel</button>
        </div>
    </header>

    <!-- WORKSPACE -->
    <div class="workspace">
        <!-- CONTROLS PANEL -->
        <aside class="controls-panel" id="controlsPanel">
            <!-- Dynamic Controls populated by JS -->
        </aside>

        <!-- STAGE AREA -->
        <main class="stage-area" id="stageArea">
            <canvas class="simulation-canvas" id="mainCanvas" width="800" height="520"></canvas>
        </main>
    </div>

    <!-- JAVASCRIPT SIMULATION LOGIC -->
    <script>
        let currentStation = 'fisika';

        // State Fisika Parabola
        let v0 = 25.0;
        let angleDeg = 45.0;
        let isSimulating = false;
        let ballX = 40;
        let ballY = 460;
        let animProgress = 0.0;
        let trajectoryPoints = [];

        // State Listrik
        let volt = 12.0;
        let r1 = 10.0;
        let r2 = 20.0;
        let circuitType = 'SERI';

        // State Kimia Titrasi
        let volAcid = 25.0;
        let mAcid = 0.1;
        let volBase = 0.0;
        let mBase = 0.1;

        // State Biologi
        let objectiveMag = 10;
        let specimen = 'STOMATA_DAUN';

        function setStation(station) {
            currentStation = station;
            ['btnFisika', 'btnListrik', 'btnKimia', 'btnBiologi'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.remove('active');
            });

            if (station === 'fisika') document.getElementById('btnFisika').classList.add('active');
            if (station === 'listrik') document.getElementById('btnListrik').classList.add('active');
            if (station === 'kimia') document.getElementById('btnKimia').classList.add('active');
            if (station === 'biologi') document.getElementById('btnBiologi').classList.add('active');

            renderControls();
            renderStage();
        }

        function renderControls() {
            const panel = document.getElementById('controlsPanel');

            if (currentStation === 'fisika') {
                panel.innerHTML = `
                    <div class="control-title">🧪 Eksperimen Gerak Parabola</div>
                    <div class="slider-group">
                        <div class="slider-header">
                            <span>Sudut Elevasi (&theta;):</span>
                            <span class="val" id="valAngle">${angleDeg}&deg;</span>
                        </div>
                        <input type="range" min="10" max="90" value="${angleDeg}" oninput="updateAngle(this.value)">
                    </div>

                    <div class="slider-group">
                        <div class="slider-header">
                            <span>Kecepatan Awal (v0):</span>
                            <span class="val" id="valV0">${v0} m/s</span>
                        </div>
                        <input type="range" min="5" max="40" value="${v0}" oninput="updateV0(this.value)">
                    </div>

                    <button class="btn-action" onclick="tembakMeriam()">🚀 Tembak Meriam Virtual</button>

                    <div class="readout-card" style="margin-top: 16px;">
                        <div style="font-weight: 700; font-size: 13px; color: #fff; margin-bottom: 8px;">Kalkulasi Teoretis Newton:</div>
                        <div class="readout-row">
                            <span>Waktu Terbang (t):</span>
                            <span class="val" id="calcTime">3.61 s</span>
                        </div>
                        <div class="readout-row">
                            <span>Jarak Jangkauan (R):</span>
                            <span class="val" id="calcRange">63.78 m</span>
                        </div>
                        <div class="readout-row">
                            <span>Tinggi Maksimum (H):</span>
                            <span class="val" id="calcHeight">15.94 m</span>
                        </div>
                    </div>
                `;
            } else if (currentStation === 'listrik') {
                panel.innerHTML = `
                    <div class="control-title">⚡ Eksperimen Hukum Ohm</div>
                    <div class="slider-group">
                        <div class="slider-header">
                            <span>Tegangan Sumber (V):</span>
                            <span class="val" id="valVolt">${volt} V</span>
                        </div>
                        <input type="range" min="1" max="24" value="${volt}" oninput="updateVolt(this.value)">
                    </div>

                    <div class="slider-group">
                        <div class="slider-header">
                            <span>Resistor 1 (R1):</span>
                            <span class="val" id="valR1">${r1} &Omega;</span>
                        </div>
                        <input type="range" min="1" max="50" value="${r1}" oninput="updateR1(this.value)">
                    </div>

                    <div class="slider-group">
                        <div class="slider-header">
                            <span>Resistor 2 (R2):</span>
                            <span class="val" id="valR2">${r2} &Omega;</span>
                        </div>
                        <input type="range" min="1" max="50" value="${r2}" oninput="updateR2(this.value)">
                    </div>

                    <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                        <button class="btn-action" style="${circuitType === 'SERI' ? 'background: #06b6d4;' : 'background: #1e293b; color: #fff;'}" onclick="setCircuitType('SERI')">Rangkaian Seri</button>
                        <button class="btn-action" style="${circuitType === 'PARALEL' ? 'background: #06b6d4;' : 'background: #1e293b; color: #fff;'}" onclick="setCircuitType('PARALEL')">Rangkaian Paralel</button>
                    </div>

                    <div class="readout-card">
                        <div style="font-weight: 700; font-size: 13px; color: #fff; margin-bottom: 8px;">Multimeter Virtual:</div>
                        <div class="readout-row">
                            <span>Hambatan Total (R_tot):</span>
                            <span class="val" id="calcRtot">30.0 &Omega;</span>
                        </div>
                        <div class="readout-row">
                            <span>Kuat Arus Listrik (I):</span>
                            <span class="val" id="calcCurrent">0.40 A</span>
                        </div>
                        <div class="readout-row">
                            <span>Daya Listrik (P):</span>
                            <span class="val" id="calcPower">4.80 Watt</span>
                        </div>
                    </div>
                `;
            } else if (currentStation === 'kimia') {
                panel.innerHTML = `
                    <div class="control-title">🧪 Eksperimen Titrasi Asam-Basa</div>
                    <div class="slider-group">
                        <div class="slider-header">
                            <span>NaOH 0.1 M Diteteskan:</span>
                            <span class="val" id="valVb">${volBase.toFixed(1)} mL</span>
                        </div>
                        <input type="range" min="0" max="40" step="0.5" value="${volBase}" oninput="updateVb(this.value)">
                    </div>

                    <button class="btn-action" onclick="teteskanNaOH()">💧 Teteskan +1.0 mL NaOH</button>

                    <div class="readout-card" style="margin-top: 16px;">
                        <div style="font-weight: 700; font-size: 13px; color: #fff; margin-bottom: 8px;">pH Meter & Indikator PP:</div>
                        <div class="readout-row">
                            <span>Titik Ekivalen (V_eq):</span>
                            <span class="val">25.0 mL</span>
                        </div>
                        <div class="readout-row">
                            <span>Derajat Keasaman (pH):</span>
                            <span class="val" id="calcPH">1.00</span>
                        </div>
                        <div class="readout-row">
                            <span>Warna Indikator PP:</span>
                            <span class="val" id="calcColor" style="color: #cbd5e1;">Bening</span>
                        </div>
                    </div>
                `;
            } else if (currentStation === 'biologi') {
                panel.innerHTML = `
                    <div class="control-title">🔬 Mikroskop Sel Digital</div>
                    <div style="margin-bottom: 16px;">
                        <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px;">Pilihan Preparat:</label>
                        <select class="btn-action" style="background: #162035; color: #fff; border: 1px solid var(--border);" onchange="setSpecimen(this.value)">
                            <option value="STOMATA_DAUN">Stomata Daun Rhoeo discolor</option>
                            <option value="SEL_BAWANG">Sel Epidermis Bawang Merah</option>
                            <option value="SEL_DARAH">Sel Darah Merah (Eritrosit)</option>
                        </select>
                    </div>

                    <div style="margin-bottom: 16px;">
                        <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px;">Lensa Objektif:</label>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
                            <button class="btn-action" style="${objectiveMag === 4 ? 'background: #06b6d4;' : 'background: #1e293b; color: #fff;'}" onclick="setMag(4)">4x (Total 40x)</button>
                            <button class="btn-action" style="${objectiveMag === 10 ? 'background: #06b6d4;' : 'background: #1e293b; color: #fff;'}" onclick="setMag(10)">10x (Total 100x)</button>
                            <button class="btn-action" style="${objectiveMag === 40 ? 'background: #06b6d4;' : 'background: #1e293b; color: #fff;'}" onclick="setMag(40)">40x (Total 400x)</button>
                            <button class="btn-action" style="${objectiveMag === 100 ? 'background: #06b6d4;' : 'background: #1e293b; color: #fff;'}" onclick="setMag(100)">100x (Total 1000x)</button>
                        </div>
                    </div>

                    <div class="readout-card">
                        <div style="font-weight: 700; font-size: 13px; color: #fff; margin-bottom: 8px;">Spesifikasi Optik:</div>
                        <div class="readout-row">
                            <span>Lensa Okuler:</span>
                            <span class="val">10x</span>
                        </div>
                        <div class="readout-row">
                            <span>Total Perbesaran:</span>
                            <span class="val" id="calcTotalMag">${objectiveMag * 10}x</span>
                        </div>
                        <div class="readout-row">
                            <span>Bidang Pandang:</span>
                            <span class="val">${4000 / objectiveMag} &mu;m</span>
                        </div>
                    </div>
                `;
            }
        }

        function renderStage() {
            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (currentStation === 'fisika') {
                drawParabola(ctx, canvas);
            } else if (currentStation === 'listrik') {
                drawCircuit(ctx, canvas);
            } else if (currentStation === 'kimia') {
                drawTitration(ctx, canvas);
            } else if (currentStation === 'biologi') {
                drawMicroscope(ctx, canvas);
            }
        }

        // DRAW FISIKA
        function drawParabola(ctx, canvas) {
            // Ground
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 460, canvas.width, 60);

            // Cannon
            ctx.save();
            ctx.translate(40, 460);
            ctx.rotate((-angleDeg * Math.PI) / 180);
            ctx.fillStyle = '#06b6d4';
            ctx.fillRect(0, -10, 45, 20);
            ctx.restore();

            // Base
            ctx.fillStyle = '#475569';
            ctx.beginPath();
            ctx.arc(40, 460, 20, Math.PI, 0);
            ctx.fill();

            // Trajectory
            if (trajectoryPoints.length > 0) {
                ctx.strokeStyle = 'rgba(6, 182, 212, 0.4)';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(trajectoryPoints[0].x, trajectoryPoints[0].y);
                trajectoryPoints.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Ball
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.arc(ballX, ballY, 8, 0, Math.PI * 2);
            ctx.fill();
        }

        function tembakMeriam() {
            trajectoryPoints = [];
            const rad = (angleDeg * Math.PI) / 180;
            const g = 9.8;
            const tTotal = (2 * v0 * Math.sin(rad)) / g;

            let t = 0;
            const interval = setInterval(() => {
                if (t > tTotal) {
                    clearInterval(interval);
                    return;
                }
                const x = 40 + (v0 * Math.cos(rad) * t * 10);
                const y = 460 - ((v0 * Math.sin(rad) * t - 0.5 * g * t * t) * 10);

                ballX = x;
                ballY = y;
                trajectoryPoints.push({ x, y });
                renderStage();

                t += 0.05;
            }, 20);
        }

        function updateAngle(val) {
            angleDeg = parseFloat(val);
            document.getElementById('valAngle').textContent = `${val}°`;
            recalcParabola();
            renderStage();
        }

        function updateV0(val) {
            v0 = parseFloat(val);
            document.getElementById('valV0').textContent = `${val} m/s`;
            recalcParabola();
            renderStage();
        }

        function recalcParabola() {
            const rad = (angleDeg * Math.PI) / 180;
            const g = 9.8;
            const t = (2 * v0 * Math.sin(rad)) / g;
            const r = (v0 * v0 * Math.sin(2 * rad)) / g;
            const h = (v0 * Math.sin(rad)) ** 2 / (2 * g);

            document.getElementById('calcTime').textContent = `${t.toFixed(2)} s`;
            document.getElementById('calcRange').textContent = `${r.toFixed(2)} m`;
            document.getElementById('calcHeight').textContent = `${h.toFixed(2)} m`;
        }

        // DRAW LISTRIK
        function drawCircuit(ctx, canvas) {
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 4;

            // Wire loop
            ctx.strokeRect(150, 100, 500, 300);

            // Battery Symbol at left
            ctx.fillStyle = '#090e18';
            ctx.fillRect(140, 230, 20, 40);
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(130, 240); ctx.lineTo(170, 240); // Long plate (+)
            ctx.moveTo(140, 260); ctx.lineTo(160, 260); // Short plate (-)
            ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.font = '14px Outfit';
            ctx.fillText(`${volt}V Sumber`, 60, 255);

            // Resistors
            if (circuitType === 'SERI') {
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(320, 85, 60, 30);
                ctx.fillText(`R1: ${r1}Ω`, 325, 75);

                ctx.fillRect(450, 85, 60, 30);
                ctx.fillText(`R2: ${r2}Ω`, 455, 75);
            } else {
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(380, 85, 60, 30);
                ctx.fillText(`R1: ${r1}Ω`, 385, 75);

                // Parallel branch
                ctx.strokeStyle = '#38bdf8';
                ctx.beginPath();
                ctx.moveTo(350, 100); ctx.lineTo(350, 200); ctx.lineTo(470, 200); ctx.lineTo(470, 100);
                ctx.stroke();

                ctx.fillRect(380, 185, 60, 30);
                ctx.fillText(`R2: ${r2}Ω`, 385, 175);
            }
        }

        function updateVolt(v) {
            volt = parseFloat(v);
            document.getElementById('valVolt').textContent = `${v} V`;
            recalcCircuit();
            renderStage();
        }

        function updateR1(r) {
            r1 = parseFloat(r);
            document.getElementById('valR1').textContent = `${r} Ω`;
            recalcCircuit();
            renderStage();
        }

        function updateR2(r) {
            r2 = parseFloat(r);
            document.getElementById('valR2').textContent = `${r} Ω`;
            recalcCircuit();
            renderStage();
        }

        function setCircuitType(t) {
            circuitType = t;
            renderControls();
            recalcCircuit();
            renderStage();
        }

        function recalcCircuit() {
            let rTot = (circuitType === 'SERI') ? (r1 + r2) : (1 / (1/r1 + 1/r2));
            let current = volt / rTot;
            let power = volt * current;

            document.getElementById('calcRtot').textContent = `${rTot.toFixed(1)} Ω`;
            document.getElementById('calcCurrent').textContent = `${current.toFixed(2)} A`;
            document.getElementById('calcPower').textContent = `${power.toFixed(2)} W`;
        }

        // DRAW KIMIA
        function drawTitration(ctx, canvas) {
            // Burette
            ctx.strokeStyle = '#94a3b8';
            ctx.strokeRect(380, 40, 40, 240);
            ctx.fillStyle = 'rgba(6, 182, 212, 0.3)';
            ctx.fillRect(382, 42, 36, 236);

            // Flask
            ctx.beginPath();
            ctx.moveTo(360, 350);
            ctx.lineTo(440, 350);
            ctx.lineTo(480, 460);
            ctx.lineTo(320, 460);
            ctx.closePath();
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Solution Color
            let solColor = 'rgba(255, 255, 255, 0.1)';
            if (volBase >= 25.0 && volBase < 26.0) {
                solColor = 'rgba(244, 114, 182, 0.6)'; // Pink
            } else if (volBase >= 26.0) {
                solColor = 'rgba(225, 29, 72, 0.85)'; // Deep Red
            }
            ctx.fillStyle = solColor;
            ctx.fill();
        }

        function updateVb(v) {
            volBase = parseFloat(v);
            document.getElementById('valVb').textContent = `${volBase.toFixed(1)} mL`;
            recalcTitration();
            renderStage();
        }

        function teteskanNaOH() {
            if (volBase < 40.0) {
                volBase += 1.0;
                updateVb(volBase);
            }
        }

        function recalcTitration() {
            let ph = 1.0;
            let col = 'Bening (Asam)';
            if (volBase < 25.0) {
                ph = 1.0 + (volBase / 25.0) * 2.5;
            } else if (volBase === 25.0) {
                ph = 7.0;
                col = 'Merah Muda (Titik Ekivalen)';
            } else {
                ph = 11.5 + ((volBase - 25) / 15) * 1.5;
                col = 'Merah Tua (Basa Kuat)';
            }
            document.getElementById('calcPH').textContent = ph.toFixed(2);
            document.getElementById('calcColor').textContent = col;
        }

        // DRAW BIOLOGI
        function drawMicroscope(ctx, canvas) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(400, 260, 200, 0, Math.PI * 2);
            ctx.clip();

            ctx.fillStyle = '#064e3b';
            ctx.fillRect(200, 60, 400, 400);

            // Draw Cells
            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 2;
            for (let x = 220; x < 580; x += (120 / (objectiveMag / 10))) {
                for (let y = 80; y < 440; y += (80 / (objectiveMag / 10))) {
                    ctx.strokeRect(x, y, 100 / (objectiveMag / 10), 60 / (objectiveMag / 10));
                    // Nucleus
                    ctx.fillStyle = '#10b981';
                    ctx.beginPath();
                    ctx.arc(x + 20, y + 20, 6 / (objectiveMag / 20), 0, Math.PI*2);
                    ctx.fill();
                }
            }
            ctx.restore();

            // Eyepiece Ring
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 16;
            ctx.beginPath();
            ctx.arc(400, 260, 200, 0, Math.PI * 2);
            ctx.stroke();
        }

        function setMag(m) {
            objectiveMag = m;
            renderControls();
            renderStage();
        }

        function setSpecimen(s) {
            specimen = s;
            renderStage();
        }

        // Init
        window.addEventListener('DOMContentLoaded', () => {
            renderControls();
            renderStage();
        });
    </script>
</body>
</html>
