[package]
name = "widya-compiler"
version = "2.6.0"
edition = "2024"
description = "Widya-Lang Compiler Infrastructure: SSA IR, Tiered JIT, Arena Allocation, LLVM Backend, and Bare-Metal Unikernel MicroVM Builder"

[dependencies]
widya-core = { path = "../widya-core" }
widya-vm = { path = "../widya-vm" }
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"

[lints.rust]
dead_code = "allow"
unused_variables = "allow"
unused_imports = "allow"
