[package]
name = "widya_os"
version = "1.0.0"
authors = ["Widya-Lang Core Architecture Team"]
edition = "2026"
description = "Sistem Operasi Desktop Berdaulat dengan Shell Polimorfik (Windows, macOS, Ubuntu) & Suite Produktivitas Bawaan"
license = "Proprietary & Sovereign Nusantara"

[os]
os_name = "WidyaOS"
os_edition = "Sovereign Desktop Enterprise"
kernel_mode = "appliance_hardened_kernel"
compositor = "widya_compositor_drm_kms"
default_persona = "windows"
supported_personas = ["windows", "macos", "ubuntu"]
boot_target = "sub_2_second_uefi"

[shell]
polymorphic_ui = true
hardware_acceleration = "direct_gpu_framebuffer"
acrylic_mica_vibrancy = true
snap_assist = true
crdt_desktop_sync = true
pqc_kernel_security = true

[bundled_applications]
office_suite = "widya_office_desktop"
file_manager = "widya_explorer"
terminal = "widya_terminal"
settings = "widya_settings"
store = "widya_store"

[dependencies]
widya_core = "path:../../crates/widya-core"
widya_desktop = "path:../../src/desktop"
widya_office = "path:../../src/office"
widya_kripto = "path:../../src/kripto"
